<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17243A">
<title>Safa Alghfees — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#17243A; --navy2:#1f2f4b; --pink:#E8C9D2; --blue:#829BCB; --lav:#C7B9E8; --off:#FAF9F7; --rose:#B97A90;
  --serif:'DM Serif Display',serif; --body:'Inter',sans-serif;
}
html[lang="ar"]{ --serif:'Amiri',serif; --body:'IBM Plex Sans Arabic',sans-serif; }
.dark{--bg:var(--navy);--bg2:var(--navy2);--text:var(--off);--muted:#a9b4cc;--line:rgba(250,249,247,.12);--card:rgba(255,255,255,.045);--acc:var(--pink);--acc2:var(--lav);--chip:rgba(255,255,255,.06)}
.light{--bg:var(--off);--bg2:#fff;--text:var(--navy);--muted:#5d677d;--line:#ebe2e5;--card:#fff;--acc:var(--rose);--acc2:#8f7fc9;--chip:#f3edef}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--navy);color:var(--off);font-family:var(--body);line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::selection{background:var(--pink);color:var(--navy)}
.wrap{position:relative;z-index:2;max-width:1240px;margin:0 auto;padding:0 32px}
section,header,.band{position:relative;background:var(--bg);color:var(--text);overflow:hidden}
.spark{display:inline-block;width:1em;height:1em;flex:none}
.spark path{fill:currentColor}
svg.spark{fill:currentColor}

/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:50;transition:background .4s,box-shadow .4s,padding .4s;padding:14px 0}
nav.solid{background:rgba(23,36,58,.82);backdrop-filter:blur(16px);box-shadow:0 10px 40px -20px rgba(0,0,0,.5);padding:4px 0}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:62px;gap:20px}
.logo{font-family:'DM Serif Display',serif;font-size:34px;color:var(--off);display:flex;align-items:center;gap:6px;letter-spacing:-.02em}
.logo .spark{color:var(--pink);width:18px;height:18px;animation:twinkle 3s ease-in-out infinite}
.links{display:flex;gap:30px;font-size:15px;color:#d6dced}
.links a{position:relative;padding:6px 2px}
.links a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1.5px;background:var(--pink);transform:scaleX(0);transition:transform .35s}
.links a:hover,.links a.act{color:var(--pink)}
.links a:hover::after,.links a.act::after{transform:scaleX(1)}
.nav-r{display:flex;gap:10px;align-items:center}
.lang{border:1px solid rgba(250,249,247,.25);background:none;color:var(--off);font:600 13px var(--body);padding:9px 14px;border-radius:99px;cursor:pointer}
.lang:hover{border-color:var(--pink);color:var(--pink)}
.pill{display:inline-flex;align-items:center;gap:10px;background:var(--pink);color:var(--navy);font-weight:600;font-size:14.5px;padding:12px 22px;border-radius:99px;transition:transform .3s,box-shadow .3s;box-shadow:0 10px 30px -12px rgba(232,201,210,.8)}
.pill:hover{box-shadow:0 16px 40px -10px rgba(232,201,210,.9)}
.pill .ar{transition:transform .3s}.pill:hover .ar{transform:translateX(4px)}
html[dir="rtl"] .pill .ar{transform:scaleX(-1)}html[dir="rtl"] .pill:hover .ar{transform:scaleX(-1) translateX(4px)}

/* hero */
.hero{min-height:100vh;display:flex;align-items:center;padding:120px 0 60px}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:30px;width:100%}
.hello{display:inline-flex;align-items:center;gap:12px;background:rgba(130,155,203,.18);border:1px solid rgba(130,155,203,.25);padding:10px 22px 10px 16px;border-radius:99px;font-size:19px;color:#e7ebf5}
.hello .spark{color:var(--pink);fill:var(--pink);width:22px;height:22px}
.hello-row{display:flex;align-items:center;gap:22px;margin-bottom:22px}
.hello-row .ln{flex:0 0 160px;height:1px;background:linear-gradient(90deg,rgba(250,249,247,.5),transparent);position:relative}
html[dir="rtl"] .hello-row .ln{background:linear-gradient(-90deg,rgba(250,249,247,.5),transparent)}
.name{font-family:var(--serif);font-weight:400;font-size:clamp(54px,6.6vw,100px);line-height:1;letter-spacing:-.02em;margin-bottom:22px}
html[lang="ar"] .name{font-weight:700;line-height:1.25;letter-spacing:0}
.name .p{color:var(--pink);background:linear-gradient(90deg,var(--pink),var(--lav),var(--pink));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.roles{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:clamp(15px,1.6vw,20px);letter-spacing:.12em;color:#e8ecf5;margin-bottom:28px}
html[lang="ar"] .roles{letter-spacing:0;font-size:clamp(16px,1.7vw,21px)}
.roles i{width:5px;height:5px;border-radius:50%;background:var(--pink);display:inline-block}
.tag{font-size:clamp(16px,1.5vw,19px);color:#c9d1e3;max-width:520px;margin-bottom:12px}
.typed{font-size:17px;color:#c9d1e3;margin-bottom:34px;min-height:1.6em}
.typed b{color:var(--pink);font-weight:600}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--pink);vertical-align:-3px;margin-inline-start:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ctas{display:flex;gap:16px;flex-wrap:wrap}
.btn{position:relative;overflow:hidden;z-index:0;display:inline-flex;align-items:center;gap:10px;padding:16px 28px;border-radius:99px;font-weight:600;font-size:15px;border:1px solid rgba(250,249,247,.4);color:var(--off);transition:color .35s,border-color .35s}
.btn::before{content:"";position:absolute;inset:0;background:var(--pink);transform:translateY(101%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:-1}
.btn:hover::before{transform:none}.btn:hover{color:var(--navy);border-color:var(--pink)}
.btn.pri{background:var(--pink);color:var(--navy);border-color:var(--pink)}
.btn.pri::before{background:var(--off)}
html[dir="rtl"] .btn .ar{display:inline-block;transform:scaleX(-1)}
.light .btn{border-color:var(--navy);color:var(--navy)}
.hero-meta{display:flex;gap:26px;flex-wrap:wrap;margin-top:44px;font-size:13.5px;color:#b8c1d6;align-items:center}
.status{display:flex;align-items:center;gap:9px;color:var(--off);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:#9fe3c4;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(159,227,196,.6)}70%{box-shadow:0 0 0 11px rgba(159,227,196,0)}100%{box-shadow:0 0 0 0 rgba(159,227,196,0)}}
.hero-meta a:hover{color:var(--pink)}

/* hero art */
.art{position:relative;height:min(620px,72vh)}
.art svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.blob{position:absolute;border-radius:50%;filter:blur(0);will-change:transform}
.hero .bgblob{position:absolute;z-index:0;pointer-events:none}
.hero .bg1{width:62vw;height:62vw;max-width:900px;max-height:900px;inset-inline-end:-18vw;top:-14vw;background:radial-gradient(circle at 40% 40%,rgba(199,185,232,.55),rgba(130,155,203,.25) 55%,transparent 70%);border-radius:46% 54% 50% 50%/55% 45% 55% 45%;animation:morph 16s ease-in-out infinite}
.hero .bg2{width:48vw;height:48vw;max-width:720px;max-height:720px;inset-inline-end:-10vw;bottom:-18vw;background:radial-gradient(circle at 50% 40%,rgba(232,201,210,.95),rgba(232,201,210,.55) 50%,transparent 72%);border-radius:58% 42% 40% 60%/50% 60% 40% 50%;animation:morph 20s ease-in-out infinite reverse}
@keyframes morph{0%,100%{border-radius:46% 54% 50% 50%/55% 45% 55% 45%;transform:translate(0,0) rotate(0)}33%{border-radius:60% 40% 35% 65%/45% 60% 40% 55%;transform:translate(-20px,20px) rotate(6deg)}66%{border-radius:40% 60% 60% 40%/60% 40% 60% 40%;transform:translate(15px,-10px) rotate(-5deg)}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.7) rotate(45deg);opacity:.6}}
.orbit{transform-origin:50% 50%;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(2.5deg)}}
.floaty{animation:floaty 7s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-12px)}}
.petal{position:absolute;width:12px;height:12px;border-radius:12px 0 12px 0;background:var(--pink);opacity:.9;pointer-events:none;z-index:3;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
.screen-glow{animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{opacity:.55}}

/* band */
.band{background:linear-gradient(90deg,var(--pink),var(--lav));color:var(--navy);padding:16px 0;overflow:hidden}
.track{display:flex;gap:44px;width:max-content;animation:scroll 34s linear infinite;font-family:var(--serif);font-size:24px;white-space:nowrap;align-items:center}
.track span{display:flex;align-items:center;gap:44px}
.track .spark{width:16px;height:16px;color:var(--navy)}
@keyframes scroll{to{transform:translateX(-50%)}}
html[dir="rtl"] .track{animation-name:scrollr}
@keyframes scrollr{to{transform:translateX(50%)}}

/* sections */
section{padding:120px 0}
.light .deco{position:absolute;border-radius:50%;pointer-events:none;z-index:0}
.deco.d1{width:560px;height:560px;inset-inline-end:-220px;bottom:-200px;background:radial-gradient(circle,rgba(232,201,210,.75),transparent 68%)}
.deco.d2{width:420px;height:420px;inset-inline-start:-240px;top:60px;border:1.5px solid rgba(130,155,203,.35);background:none}
.deco.d3{width:380px;height:380px;inset-inline-start:-140px;top:-120px;background:radial-gradient(circle,rgba(199,185,232,.5),transparent 68%)}
.dark .deco.d1{background:radial-gradient(circle,rgba(199,185,232,.18),transparent 68%)}
.chip-t{display:inline-flex;align-items:center;gap:10px;padding:8px 20px 8px 12px;border-radius:99px;background:linear-gradient(90deg,rgba(232,201,210,.55),rgba(232,201,210,.12));font-size:17px;font-weight:500;color:var(--text);margin-bottom:18px}
.dark .chip-t{background:linear-gradient(90deg,rgba(232,201,210,.22),rgba(232,201,210,.03))}
html[dir="rtl"] .chip-t{background:linear-gradient(-90deg,rgba(232,201,210,.55),rgba(232,201,210,.12))}
html[dir="rtl"] .dark .chip-t{background:linear-gradient(-90deg,rgba(232,201,210,.22),rgba(232,201,210,.03))}
.chip-t .spark{color:var(--rose);width:24px;height:24px;animation:twinkle 3.5s ease-in-out infinite}
.dark .chip-t .spark{color:var(--pink)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:56px;flex-wrap:wrap}
.sec-title{font-family:var(--serif);font-weight:400;font-size:clamp(42px,5.4vw,72px);line-height:1.04;letter-spacing:-.01em}
html[lang="ar"] .sec-title{font-weight:700;line-height:1.35;letter-spacing:0}
.sec-title em{font-style:normal;color:var(--acc)}
.sec-sub{color:var(--muted);max-width:400px;font-size:16px}
.mask{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.1em}
.mask>span{display:inline-block;transform:translateY(110%);transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.in .mask>span,.mask.in>span{transform:none}
.reveal{opacity:0;transform:translateY(30px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

/* about */
.about{display:grid;grid-template-columns:1fr 1.25fr;gap:60px;align-items:center}
.about p{font-size:17.5px;color:var(--muted);margin:6px 0 28px;max-width:500px}
.about p em{font-style:normal;color:var(--text);font-weight:600}
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.sv{background:rgba(255,255,255,.75);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:22px;padding:30px 14px 26px;text-align:center;transition:box-shadow .4s,border-color .4s;opacity:0;transform:translateY(30px)}
.svc.in .sv{opacity:1;transform:none;transition:opacity .7s,transform .8s cubic-bezier(.2,.8,.2,1),box-shadow .4s,border-color .4s}
.sv:hover{box-shadow:0 26px 50px -24px rgba(185,122,144,.55);border-color:var(--pink)}
.sv .si{width:62px;height:62px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(232,201,210,.7),rgba(232,201,210,.15));transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.sv:hover .si{transform:translateY(-6px) rotate(-10deg) scale(1.08)}
.sv .si svg{width:34px;height:34px}
.sv b{font-weight:500;font-size:15.5px;line-height:1.4;display:block}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.fact{display:flex;gap:8px;background:var(--chip);border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-size:13.5px}
.fact span:first-child{color:var(--muted)}
.fact span:last-child{font-weight:500}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:70px}
.stat{background:var(--navy);color:var(--off);border-radius:24px;padding:30px 26px;position:relative;overflow:hidden}
.stat:nth-child(2){background:var(--pink);color:var(--navy)}
.stat:nth-child(3){background:var(--lav);color:var(--navy)}
.stat:nth-child(4){background:var(--blue);color:var(--navy)}
.stat b{display:block;font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(46px,5.4vw,72px);line-height:1}
.stat b sup{font-size:.42em;vertical-align:top;margin-inline-start:4px}
.stat>span{font-size:14.5px;margin-top:8px;display:block;opacity:.85}
.stat::after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;inset-inline-end:-40px;top:-40px;background:rgba(255,255,255,.18);transition:transform .6s}
.stat:hover::after{transform:scale(1.6)}

/* projects */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}
.filters button{background:var(--chip);border:1px solid var(--line);color:var(--muted);padding:10px 20px;border-radius:99px;cursor:pointer;font:500 14px var(--body);transition:.3s}
.filters button.on,.filters button:hover{background:var(--pink);color:var(--navy);border-color:var(--pink)}
.projects{border-top:1px solid var(--line)}
.proj{display:grid;grid-template-columns:60px 1.1fr 1.4fr auto;gap:28px;align-items:start;padding:30px 18px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;border-radius:18px;opacity:0;transform:translateY(40px)}
.proj.in{opacity:1;transform:none;transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1),background .35s}
.proj:hover{background:var(--card)}
.proj .n{font-family:'DM Serif Display',serif;color:var(--acc);font-size:20px;padding-top:6px}
.proj h3{font-family:var(--serif);font-size:clamp(26px,3vw,38px);font-weight:400;line-height:1.1;transition:transform .45s cubic-bezier(.2,.8,.2,1),color .3s}
html[lang="ar"] .proj h3{font-weight:700;line-height:1.35}
.proj:hover h3{color:var(--acc);transform:translateX(10px)}
html[dir="rtl"] .proj:hover h3{transform:translateX(-10px)}
.proj .cat{display:block;color:var(--acc2);font-family:var(--body);font-size:13px;font-weight:500;margin-top:8px}
.proj p{color:var(--muted);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tags span{font-size:12px;background:var(--chip);border:1px solid var(--line);padding:3px 11px;border-radius:99px;color:var(--text);opacity:.85}
.arrow{width:48px;height:48px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;transition:.35s;font-size:18px}
.proj:hover .arrow{background:var(--pink);color:var(--navy);border-color:var(--pink);transform:rotate(-45deg)}
html[dir="rtl"] .arrow{transform:scaleX(-1)}html[dir="rtl"] .proj:hover .arrow{transform:scaleX(-1) rotate(-45deg)}
.proj.hide{display:none}
.badge{display:inline-block;background:var(--pink);color:var(--navy);font:700 11.5px var(--body);padding:4px 11px;border-radius:99px;margin-bottom:10px;margin-inline-end:6px}
.badge.win{background:#f4d58d;animation:wiggle 3s ease-in-out infinite}
@keyframes wiggle{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-8deg) scale(1.1)}92%{transform:rotate(8deg) scale(1.1)}95%{transform:rotate(-4deg)}}
.proj.grad{background:linear-gradient(90deg,rgba(232,201,210,.09),transparent)}
html[dir="rtl"] .proj.grad{background:linear-gradient(-90deg,rgba(232,201,210,.09),transparent)}

/* modal */
.modal{position:fixed;inset:0;z-index:90;background:rgba(15,24,40,.7);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.mbox{--text:var(--navy);--muted:#5d677d;--line:#ebe2e5;--chip:#f3edef;background:var(--off);color:var(--navy);border-radius:26px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:40px;position:relative;animation:pop .4s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
.mbox .x{position:absolute;top:18px;inset-inline-end:18px;background:#fff;border:1px solid #ebe2e5;color:var(--navy);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:15px}
.mbox h3{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.15;margin:10px 0 14px}
html[lang="ar"] .mbox h3{font-weight:700}
.mbox ul{list-style:none;margin-top:18px;display:grid;gap:10px}
.mbox li{padding-inline-start:22px;position:relative;font-size:15px;color:#34405a}
.mbox li::before{content:"✦";position:absolute;inset-inline-start:0;top:0;color:var(--rose);font-size:13px}
.mbox .pl{display:inline-block;margin-top:22px;background:var(--navy);color:var(--off);padding:11px 20px;border-radius:99px;font-weight:600;font-size:14px}

/* skills & tools */
.sub-h{font-size:14px;font-weight:600;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:18px;display:flex;align-items:center;gap:12px}
html[lang="ar"] .sub-h{letter-spacing:0;font-size:16px}
.sub-h::after{content:"";flex:1;height:1px;background:var(--line)}
.tools{display:grid;grid-template-columns:repeat(7,1fr);gap:14px;margin-bottom:50px}
.tool{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 10px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;transform:translateY(30px) scale(.9)}
.tools.in .tool{opacity:1;transform:none;transition:opacity .6s,transform .7s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s}
.tool .lg{width:60px;height:60px;border-radius:18px;background:var(--off);display:grid;place-items:center;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.tool .lg img{width:36px;height:36px}
.tool small{font-size:13px;font-weight:500;direction:ltr}
.tool:hover{border-color:var(--pink);box-shadow:0 22px 44px -22px rgba(185,122,144,.6)}
.tool:hover .lg{transform:translateY(-8px) rotate(-8deg) scale(1.08);background:#fbeff3}
.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.sk{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px 26px;transition:box-shadow .4s,border-color .4s}
.sk:hover{border-color:var(--pink);box-shadow:0 22px 44px -22px rgba(185,122,144,.5)}
.sk .ic{font-family:'DM Serif Display',serif;font-size:22px;color:var(--rose)}
.sk h4{font-family:var(--serif);font-weight:400;font-size:25px;margin:6px 0 18px}
html[lang="ar"] .sk h4{font-weight:700}
.sk ul{list-style:none;display:grid;gap:10px;font-size:14.5px;color:#3b465e}
.sk li{display:flex;align-items:center;gap:10px}
.sk li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pink)}
.sk li img{width:20px;height:20px;border-radius:6px;background:var(--off);padding:2px}
.sk li.wi::before{display:none}

/* certs */
.certs-sec{background:linear-gradient(180deg,var(--off),#f6edf0)}
.certs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cert{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;transition:box-shadow .4s,border-color .4s}
.cert:hover{border-color:var(--pink);box-shadow:0 24px 44px -24px rgba(185,122,144,.55)}
.cert .ic2{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,rgba(232,201,210,.8),rgba(232,201,210,.2));display:grid;place-items:center;color:var(--rose);font-size:16px;margin-bottom:16px}
.cert h5{font-family:var(--serif);font-weight:400;font-size:21px;line-height:1.3}
html[lang="ar"] .cert h5{font-weight:700}
.cert .by{color:var(--muted);font-size:12.5px;margin-top:8px}
.cert .meta{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.cert .k{font-size:12.5px;color:var(--rose);font-weight:600}
.cert .hrs{font-size:12px;background:var(--chip);border-radius:99px;padding:2px 10px}
.cert.prog{border-style:dashed;background:rgba(255,255,255,.6)}
.cert.prog .k{color:#6f86b8}
.cert .pbar{height:4px;border-radius:4px;background:#eee6ea;overflow:hidden;margin-top:12px}
.cert .pbar i{display:block;height:100%;width:45%;background:linear-gradient(90deg,var(--blue),var(--lav));animation:prog 2.2s ease-in-out infinite alternate}
@keyframes prog{from{transform:translateX(-60%)}to{transform:translateX(160%)}}

/* journey */
.tl{position:relative;padding-inline-start:40px}
.tl::before{content:"";position:absolute;inset-inline-start:11px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--pink),var(--lav),var(--blue));transform-origin:top;transform:scaleY(var(--tlp,0));transition:transform .2s}
.ev{position:relative;display:grid;grid-template-columns:220px 1fr 1fr;gap:28px;padding:26px 0;border-bottom:1px solid var(--line);opacity:0;transform:translateX(-30px)}
html[dir="rtl"] .ev{transform:translateX(30px)}
.ev.in{opacity:1;transform:none;transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}
.ev::before{content:"";position:absolute;inset-inline-start:-36px;top:32px;width:16px;height:16px;border-radius:50%;background:var(--navy);border:3px solid var(--pink);box-shadow:0 0 0 6px rgba(232,201,210,.12)}
.ev .when{color:var(--pink);font-size:14px;padding-top:4px;font-weight:500}
.ev h4{font-family:var(--serif);font-weight:400;font-size:25px;line-height:1.25;transition:color .3s}
html[lang="ar"] .ev h4{font-weight:700}
.ev:hover h4{color:var(--pink)}
.ev .role{color:var(--lav);font-size:14px;margin-top:6px}
.ev p{color:var(--muted);font-size:15px}

/* contact */
.contact{text-align:center;padding:150px 0 90px}
.contact .chip-t{margin-bottom:26px}
.contact .cta{font-family:var(--serif);font-weight:400;font-size:clamp(46px,7.5vw,108px);line-height:1.05;display:block}
html[lang="ar"] .contact .cta{font-weight:700;line-height:1.4}
.contact .cta em{font-style:normal;color:var(--pink)}
.contact .ctas{justify-content:center;margin-top:40px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:900px;margin:60px auto 0}
.cbox{border:1px solid var(--line);border-radius:22px;padding:24px;text-align:start;background:var(--card);transition:border-color .3s,background .3s}
.cbox:hover{border-color:var(--pink);background:rgba(232,201,210,.08)}
.cbox small{color:var(--pink);font-size:13px;font-weight:500}
.cbox div{margin-top:8px;font-weight:500;font-size:15.5px;word-break:break-all;direction:ltr;text-align:start}
html[dir="rtl"] .cbox div{text-align:end}
.copy{margin-top:10px;background:none;border:0;color:var(--lav);font:500 13px var(--body);cursor:pointer;padding:0}
footer{background:#111c2e;color:#9aa6bf;padding:28px 0;font-size:13.5px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center}
footer .logo{font-size:24px}

/* chat */
.chat-btn{position:fixed;bottom:22px;inset-inline-end:22px;z-index:60;background:var(--pink);color:var(--navy);border:0;border-radius:99px;padding:13px 20px 13px 16px;font:600 14px var(--body);cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:0 14px 40px -10px rgba(23,36,58,.6)}
.chat-btn i{width:9px;height:9px;border-radius:50%;background:#3fb68b;display:block}
.chat{position:fixed;bottom:84px;inset-inline-end:22px;z-index:61;width:min(380px,calc(100vw - 32px));height:min(540px,calc(100vh - 120px));background:var(--off);color:var(--navy);border-radius:24px;display:none;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(10,18,32,.55)}
.chat.open{display:flex;animation:pop .3s}
.chat-h{padding:16px 18px;background:var(--navy);color:var(--off);display:flex;align-items:center;gap:12px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--lav));display:grid;place-items:center;color:var(--navy);font-family:'DM Serif Display',serif;font-size:20px}
.chat-h b{display:block;font-size:15px}.chat-h small{color:#b8c1d6;font-size:12px}
.chat-h button{margin-inline-start:auto;background:none;border:0;color:#b8c1d6;font-size:18px;cursor:pointer}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;animation:pop .25s}
.m.bot{background:#fff;border:1px solid #ebe2e5;align-self:flex-start;border-end-start-radius:4px}
.m.me{background:var(--navy);color:var(--off);align-self:flex-end;border-end-end-radius:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.chips button{background:#fff;border:1px solid #e3d6db;color:var(--navy);border-radius:99px;padding:6px 12px;font:500 12.5px var(--body);cursor:pointer}
.chips button:hover{background:var(--pink);border-color:var(--pink)}
.chat form{display:flex;gap:8px;padding:12px;border-top:1px solid #ebe2e5;background:#fff}
.chat input{flex:1;background:var(--off);border:1px solid #ebe2e5;border-radius:99px;padding:10px 16px;color:var(--navy);font:14px var(--body);outline:none}
.chat input:focus{border-color:var(--pink)}
.chat form button{background:var(--navy);border:0;border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:15px;color:var(--pink)}
.typing{display:flex;gap:4px;padding:14px}
.typing span{width:6px;height:6px;border-radius:50%;background:#b9a7b0;animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-5px);opacity:.4}}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--off);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;z-index:95;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}

/* motion layer */
.progress{position:fixed;top:0;inset-inline-start:0;height:3px;width:0;background:linear-gradient(90deg,var(--pink),var(--lav),var(--blue));z-index:100}
.cur,.cur-ring{position:fixed;top:0;left:0;pointer-events:none;z-index:200;border-radius:50%}
.cur{width:7px;height:7px;background:var(--pink);mix-blend-mode:difference}
.cur-ring{width:38px;height:38px;border:1.5px solid var(--pink);transition:width .25s,height .25s,background .25s,margin .25s;margin:-19px 0 0 -19px}
.cur{margin:-3.5px 0 0 -3.5px}
.cur-ring.big{width:70px;height:70px;margin:-35px 0 0 -35px;background:rgba(232,201,210,.18)}
.cur-ring.txt{width:88px;height:88px;margin:-44px 0 0 -44px;background:var(--pink)}
.cur-ring.txt::after{content:attr(data-t);position:absolute;inset:0;display:grid;place-items:center;color:var(--navy);font:700 12.5px var(--body)}
@media (hover:none),(pointer:coarse){.cur,.cur-ring{display:none}}
.loader-x{position:fixed;inset:0;z-index:300;background:var(--navy);color:var(--off);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:transform 1s cubic-bezier(.8,0,.2,1)}
.loader.done{transform:translateY(-100%)}
.loader .ln{font-family:'DM Serif Display',serif;font-size:clamp(64px,12vw,150px);line-height:1}
.loader .ln span{color:var(--pink)}
.loader .lt{display:flex;align-items:center;gap:10px;color:#b8c1d6;font-size:14px;letter-spacing:.3em;text-transform:uppercase}
.loader .lt .spark{color:var(--pink);width:16px;height:16px;animation:twinkle 1.2s infinite}
.loader .bar{width:min(320px,70vw);height:2px;background:rgba(255,255,255,.12);overflow:hidden;border-radius:2px}
.loader .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--lav))}
.pv{position:fixed;top:0;left:0;width:270px;height:175px;border-radius:22px;pointer-events:none;z-index:40;opacity:0;transform:translate(40px,-50%) scale(.6) rotate(-6deg);transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:22px;color:var(--navy);box-shadow:0 30px 70px -20px rgba(0,0,0,.55)}
.pv.on{opacity:1;transform:translate(40px,-50%) scale(1) rotate(-3deg)}
html[dir="rtl"] .pv{transform:translate(calc(-100% - 40px),-50%) scale(.6) rotate(6deg)}html[dir="rtl"] .pv.on{transform:translate(calc(-100% - 40px),-50%) scale(1) rotate(3deg)}
.pv .e{font-family:'DM Serif Display',serif;font-size:46px;line-height:1;opacity:.55}
.pv b{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.15}
html[lang="ar"] .pv b{font-weight:700}
.pv small{font-size:12px;font-weight:600;opacity:.7;display:block}
@media (hover:none){.pv{display:none}}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:120}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.mask>span,.proj,.ev,.tool,.sv,.reveal{transform:none!important;opacity:1!important}.loader-x{display:none}}
@media (max-width:1000px){

}

 -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 32%),linear-gradient(180deg,transparent 0%,#000 16%);-webkit-mask-composite:source-in;
 mask-image:linear-gradient(90deg,transparent 0%,#000 32%),linear-gradient(180deg,transparent 0%,#000 16%);mask-composite:intersect;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
html[dir="rtl"] .heroimg{-webkit-mask-image:linear-gradient(-90deg,transparent 0%,#000 32%),linear-gradient(180deg,transparent 0%,#000 16%);mask-image:linear-gradient(-90deg,transparent 0%,#000 32%),linear-gradient(180deg,transparent 0%,#000 16%)}
.heroimg img{width:100%;height:100%;display:block;object-fit:cover;animation:heroin 1.6s cubic-bezier(.2,.8,.2,1) both}

 .hero{flex-direction:column;align-items:stretch;padding-bottom:0}

{k:["cert","course","workshop","شهاد","دور","ورش"],a:{en:"Safa's certificates include Importance of Data Science and AI, Word, and Digital Marketing Tools (HRDF e-Training / Doroob), Python Basics, Your Gateway to Learning Git & GitHub, Enfath Innovation, and the Complete Data Analysis Journey (Excel). She has also completed Web Application Development.",ar:"من شهادات صفاء: أهمية علوم البيانات والذكاء الاصطناعي، برنامج Word، ووسائل وتقنيات التسويق الإلكتروني (دروب — صندوق تنمية الموارد البشرية)، أساسيات Python، بوابتك لتعلم Git وGitHub، ابتكار إنفاذ، ورحلة تحليل البيانات الكاملة (Excel). وأنجزت أيضًا دورة تطوير تطبيقات الويب."}},
{k:["skill","stack","tech","language","مهار","تقني","لغات","برمج"],a:{en:"Safa works across the stack: HTML, CSS, JavaScript and React prototypes on the front; PHP, SQL/MySQL and Python on the back; and Figma for UI/UX design.",ar:"صفاء تشتغل على كامل المراحل: HTML وCSS وJavaScript ونماذج React للواجهات، وPHP وSQL/MySQL وPython للخلفية، وFigma لتصميم الواجهات وتجربة المستخدم."}},
{k:["graduat","تخرج","سكر","sugar"],a:{en:"Safa's graduation project is Sugar Heroes: a game-style diabetes awareness website for children (HTML/CSS/PHP) with missions, rewards, a food guide by sugar level, and a parent view.",ar:"مشروع تخرج صفاء هو «أبطال السكر»: موقع توعية بالسكري للأطفال بأسلوب لعبة (HTML/CSS/PHP) فيه مهام ومكافآت ودليل أطعمة حسب نسبة السكر وواجهة لولي الأمر."}},
{k:["project","work","portfolio","مشروع","مشاريع","أعمال","شغل"],a:{en:"Her graduation project is Sugar Heroes, a game-style diabetes awareness site for kids. Other work: Daftar (accounting system), Policy Observatory (AI policy analysis), Smart Cooking Assistant, and hackathon prototypes like MIYAR, Sir Tech, Mizan (1st place), Thamar, Asset Passport, Mabar and FURSA, plus Figma designs: Brewly Coffee, FurnitureCo and Mahami.",ar:"مشروع تخرجها «أبطال السكر»، موقع توعية بالسكري للأطفال بأسلوب لعبة. ومن أعمالها: دفتر (نظام محاسبة)، مرصد السياسات (تحليل بالذكاء الاصطناعي)، مساعد الطبخ الذكي، ونماذج هاكاثونات مثل مِعيار وسير تك وميزان (المركز الأول) وثَمَر وجواز الأصل ومعبر وفُرصة، وتصاميم Figma: Brewly Coffee وFurnitureCo ومهامي."}},
{k:["win","award","first","place","فوز","فايز","فازت","مركز","جائز","إنجاز"],a:{en:"Safa's team kernel won first place in the auctions track at the Enfath Innovation hackathon with Mizan, an auction-integrity intelligence layer — she was team lead.",ar:"فريق صفاء (kernel) فاز بالمركز الأول في مسار المزادات بهاكاثون إنفاذ ابتكار بمشروع ميزان لنزاهة المزادات، وكانت هي قائدة الفريق."}},
{k:["club","hash","volunteer","نادي","هاش","تطوع","لجنة"],a:{en:"Safa was a member of the Operations Committee at Hash Club.",ar:"صفاء كانت عضو في لجنة العمليات بنادي هاش."}},
{k:["hack","lead","team","هاكاثون","قائد","فريق","مسابق"],a:{en:"Safa has joined several hackathons — Riwad (team lead, MIYAR), Enfath Innovation (team lead — 1st place in the auctions track with Mizan), the Food Loss & Waste Hackathon (Thamar), the Energy Hackathon, and Tuwaiq Clubs' Garage program (team lead, Sir Tech).",ar:"شاركت صفاء في عدة هاكاثونات — رواد (قائدة فريق مِعيار)، إنفاذ ابتكار (قائدة فريق ميزان — المركز الأول في مسار المزادات)، هاكاثون الفقد والهدر الغذائي (ثَمَر)، هاكاثون الطاقة، وبرنامج الكراج بأندية طويق (قائدة فريق سير تك)."}},
{k:["design","ui","ux","figma","تصميم","واجهة","واجهات"],a:{en:"Design is half of what Safa does: she maps the experience in Figma — wireframes, flows, prototypes — with a focus on clean, Arabic-first (RTL) interfaces.",ar:"التصميم نص شغل صفاء: ترسم التجربة على Figma — مخططات، رحلات مستخدم، ونماذج تفاعلية — مع تركيز على واجهات عربية (RTL) نظيفة."}},

{k:["study","university","education","who","about","دراس","جامع","مين","من هي","نبذة"],a:{en:"Safa Alghfees studies Programming & Computer Science at Qassim University. She builds websites and apps, designs UI/UX, and aims to be a full-stack developer.",ar:"صفاء عبدالرحمن الغفيص تدرس برمجة وعلوم حاسب في جامعة القصيم، تبني المواقع والتطبيقات وتصمم الواجهات، وطموحها تكون مطوّرة Full-Stack."}},
{k:["ai","ذكاء","ai"],a:{en:"Several of Safa's projects use AI — the Policy Observatory analyzes store policies with an AI API, the Cooking Assistant has a recipe chatbot, and Asset Passport analyzes asset files for gaps.",ar:"عدة مشاريع لصفاء فيها ذكاء اصطناعي — مرصد السياسات يحلل السياسات عبر API ذكي، ومساعد الطبخ فيه شات بوت للوصفات، وجواز الأصل يحلل ملفات الأصول ويكشف النواقص."}}
];
const CHIPS={en:["Graduation project","Skills","Projects","Certificates","Hackathons","Design","Contact"],ar:["مشروع التخرج","المهارات","المشاريع","الشهادات","الهاكاثونات","التصميم","التواصل"]};

let L="en",F="all";
try{const s=localStorage.getItem("safa_lang");if(s)L=s}catch(e){}
const $=s=>document.querySelector(s);

function render(){
  document.documentElement.lang=L;document.documentElement.dir=L==="ar"?"rtl":"ltr";
  $("#langBtn").textContent=L==="ar"?"EN":"عربي";
  document.querySelectorAll("[data-i]").forEach(el=>{el.innerHTML=T[L][el.dataset.i]});
  $("#chatIn").placeholder=T[L].ph;
  $("#facts").innerHTML=FACTS[L].map(f=>`<div class="fact"><span>${f[0]}</span><span>${f[1]}</span></div>`).join("");
  const words=L==="ar"?["مواقع ويب","تطبيقات","تصميم واجهات","قواعد بيانات","هاكاثونات","نماذج أولية"]:["Websites","Web Apps","UI/UX Design","Databases","Hackathons","Prototypes"];
  $("#track").innerHTML=[...words,...words,...words].map(w=>`<span>${w}${SPK}</span>`).join("");
  const w2=L==="ar"?["HTML","CSS","JavaScript","PHP","MySQL","Python","React","Figma","Git"]:["HTML","CSS","JavaScript","PHP","MySQL","Python","React","Figma","Git"];
  $("#track2").innerHTML=[...w2,...w2,...w2].map(w=>`<span>${w}${SPK}</span>`).join("");
  $("#roles").innerHTML=ROLES[L].map(r=>`<span>${r}</span>`).join("<i></i>");
  $("#svc").innerHTML=SVC.map((v,i)=>`<div class="sv tilt" style="transition-delay:${i*90}ms"><div class="si">${SVG_I[v[0]]}</div><b>${v[1][L]}</b></div>`).join("");
  $("#filters").innerHTML=["all","dev","hack","ui"].map(k=>`<button data-f="${k}" class="${F===k?'on':''}">${T[L]['f_'+k]}</button>`).join("");
  $("#projects").innerHTML=P.map((p,i)=>`<div class="proj ${p.grad||p.win?'grad':''} ${F!=='all'&&p.c!==F?'hide':''}" data-p="${i}">
    <div class="n">${String(i+1).padStart(2,"0")}</div>
    <div>${p.grad?`<span class="badge">${L==="ar"?"مشروع التخرج":"Graduation Project"}</span>`:""}${p.win?`<span class="badge win">${L==="ar"?"المركز الأول":"1st Place"}</span>`:""}<h3>${p.t[L]}<span class="cat">${p.cat[L]}</span></h3></div>
    <div class="pd"><p>${p.d[L]}</p><div class="tags">${p.tags.map(t=>`<span>${t}</span>`).join("")}</div></div>
    <button class="arrow" aria-label="${L==='ar'?'تفاصيل المشروع':'Project details'}">→</button></div>`).join("");
  $("#skillsGrid").innerHTML=SK.map(s=>`<div class="sk glowc"><div class="ic">${s.i}</div><h4>${s.t[L]}</h4><ul>${s.l.map(x=>SKI[x]?`<li class="wi"><img src="${ICONS[SKI[x]]}" alt="">${x}</li>`:`<li>${x}</li>`).join("")}</ul></div>`).join("");
  const cc=(c,pr)=>`<div class="cert tilt glowc ${pr?'prog':''}"><div><div class="ic2">${pr?'◔':'✦'}</div><h5>${c.n[L]}</h5>${c.by?`<div class="by">${c.by[L]}</div>`:""}</div><div><div class="meta"><span class="k">${c.k[L]}</span></div>${pr?'<div class="pbar"><i></i></div>':''}</div></div>`;
  $("#certGrid").innerHTML=CERTS.map(c=>cc(c)).join("");
  $("#tools").innerHTML=TOOLS.map((t,i)=>`<div class="tool tilt" style="transition-delay:${i*45}ms"><div class="lg"><img src="${ICONS[t[0]]}" alt="${t[1]}"></div><small>${t[1]}</small></div>`).join("");
  $("#stats").innerHTML=[[P.length,"",T[L].st1],[5,"",T[L].st2],[CERTS.length,"+",T[L].st3],[1,L==="ar"?"":"st",T[L].st4]].map(x=>`<div class="stat glowc"><b><span class="cnt" data-n="${x[0]}">0</span><sup>${x[1]}</sup></b><span>${x[2]}</span></div>`).join("");
  $("#timeline").innerHTML=EV.map(e=>`<div class="ev"><div class="when">${e.w[L]}</div><div><h4>${e.h[L]}</h4><div class="role">${e.r[L]}</div></div><p>${e.p[L]}</p></div>`).join("");
  $("#chips").innerHTML=CHIPS[L].map(c=>`<button>${c}</button>`).join("");
  $("#msgs").innerHTML="";addMsg(T[L].greet,"bot");
}
$("#langBtn").onclick=()=>{L=L==="en"?"ar":"en";try{localStorage.setItem("safa_lang",L)}catch(e){}render()};
$("#filters").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;F=b.dataset.f;render()});
$("#projects").addEventListener("click",e=>{if(!e.target.closest(".arrow"))return;const r=e.target.closest(".proj");if(!r)return;const p=P[r.dataset.p];
  $("#mbody").innerHTML=`<span class="cat" style="color:var(--rose);font-size:13px;font-weight:600">${p.cat[L]}</span><h3>${p.t[L]}</h3><p style="color:var(--muted)">${p.d[L]}</p><ul>${p.pts[L].map(x=>`<li>${x}</li>`).join("")}</ul><div class="tags" style="margin-top:22px">${p.tags.map(t=>`<span>${t}</span>`).join("")}</div>${p.link?`<a href="${p.link}" target="_blank" rel="noopener" class="pl">${L==="ar"?"جرّب النموذج ↗":"Try the prototype ↗"}</a>`:""}`;
  $("#modal").classList.add("open")});
$("#mx").onclick=()=>$("#modal").classList.remove("open");
$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").classList.remove("open")};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#modal").classList.remove("open");$("#chat").classList.remove("open")}});

function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1600)}
document.querySelectorAll(".copy").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);toast(T[L].copied)}catch(e){toast(b.dataset.copy)}});

/* chat */
function openChat(){$("#chat").classList.add("open");setTimeout(()=>$("#chatIn").focus(),100)}
window.openChat=openChat;
$("#chatBtn").onclick=()=>$("#chat").classList.toggle("open");
$("#chatX").onclick=()=>$("#chat").classList.remove("open");
function addMsg(t,who){const d=document.createElement("div");d.className="m "+who;d.textContent=t;$("#msgs").appendChild(d);$("#msgs").scrollTop=1e6}
function answer(q){const s=q.toLowerCase();const hit=QA.find(x=>x.k.some(k=>s.includes(k)));return hit?hit.a[L]:T[L].fallback}
function ask(q){if(!q.trim())return;addMsg(q,"me");const ty=document.createElement("div");ty.className="m bot typing";ty.innerHTML="<span></span><span></span><span></span>";$("#msgs").appendChild(ty);$("#msgs").scrollTop=1e6;
  setTimeout(()=>{ty.remove();addMsg(answer(q),"bot")},650)}
$("#chatForm").onsubmit=e=>{e.preventDefault();ask($("#chatIn").value);$("#chatIn").value=""};
$("#chips").addEventListener("click",e=>{const b=e.target.closest("button");if(b)ask(b.textContent)});

render();

/* ================= MOTION ================= */
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches, FINE=matchMedia("(hover:hover) and (pointer:fine)").matches;
let io;
function observe(){
  io&&io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){const t=en.target;t.classList.add("in");if(t.classList.contains("stats"))countUp();io.unobserve(t)}}),{threshold:.12,rootMargin:"0px 0px -6% 0px"});
  document.querySelectorAll(".reveal:not(.in),.svc:not(.in),.proj:not(.in),.ev:not(.in),.tools:not(.in),.sec-title .mask:not(.in),#stats").forEach(el=>io.observe(el));
  document.querySelectorAll(".proj").forEach((el,i)=>el.style.transitionDelay=(i%4)*70+"ms");
  document.querySelectorAll(".ev").forEach((el,i)=>el.style.transitionDelay=i*90+"ms");
  bindFx();
}
function countUp(){document.querySelectorAll(".cnt").forEach(el=>{const n=+el.dataset.n,t0=performance.now(),d=1600;(function f(t){const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,4);el.textContent=Math.round(n*e);if(k<1)requestAnimationFrame(f)})(t0)})}
/* typed */
const WORDS={en:["websites.","web apps.","dashboards.","AI prototypes.","interfaces people love."],ar:["مواقع ويب.","تطبيقات.","لوحات تحكم.","نماذج ذكاء اصطناعي.","واجهات يحبها الناس."]};
let tw=0,tc=0,tdel=false,tTimer;
function typeLoop(){const w=WORDS[L][tw%WORDS[L].length],el=$("#typed");if(!el)return;
  tc+=tdel?-1:1;el.textContent=w.slice(0,tc);
  let d=tdel?35:75;if(!tdel&&tc===w.length){d=1500;tdel=true}else if(tdel&&tc===0){tdel=false;tw++;d=300}
  tTimer=setTimeout(typeLoop,d)}
/* cursor, spotlight, progress */
const pv=$("#pv");let pvOn=false,pvx=0,pvy=0;
const cur=$("#cur"),ring=$("#ring");let mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
addEventListener("mousemove",e=>{mx=e.clientX;my=e.clientY;
  document.documentElement.style.setProperty("--mx",mx+"px");document.documentElement.style.setProperty("--my",my+"px")});
(function loop(){rx+=(mx-rx)*.2;ry+=(my-ry)*.2;cur.style.transform=`translate(${rx}px,${ry}px)`;
  if(pvOn){pvx+=(mx-pvx)*.14;pvy+=(my-pvy)*.14;pv.style.left=pvx+"px";pv.style.top=pvy+"px"}requestAnimationFrame(loop)})();
addEventListener("scroll",()=>{const h=document.documentElement;$("#prog").style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+"%";
  $("#nav").classList.toggle("solid",scrollY>40);
  const tl=$("#timeline");if(tl){const r=tl.getBoundingClientRect();tl.style.setProperty("--tlp",Math.max(0,Math.min(1,(innerHeight*.7-r.top)/r.height)))}
  let cur="top";document.querySelectorAll("header[id],section[id]").forEach(sec=>{if(sec.getBoundingClientRect().top<innerHeight*.4)cur=sec.id});
  document.querySelectorAll(".links a").forEach(a=>a.classList.toggle("act",a.getAttribute("href")==="#"+cur))},{passive:true});
/* project preview */
function bindFx(){
  document.querySelectorAll("a,button,.cbox").forEach(el=>{if(el._c)return;el._c=1;el.addEventListener("mouseenter",()=>cur.classList.add("big"));el.addEventListener("mouseleave",()=>cur.classList.remove("big"))});

  if(!FINE||RM)return;
  document.querySelectorAll(".tilt,.sk,.cbox").forEach(el=>{if(el._t)return;el._t=1;
    el.addEventListener("mousemove",e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      el.style.transform=`perspective(700px) rotateY(${x*12}deg) rotateX(${-y*12}deg) translateZ(0)`;el.style.transition="transform .1s"});
    el.addEventListener("mouseleave",()=>{el.style.transform="";el.style.transition=""})});
  document.querySelectorAll(".glowc").forEach(el=>{if(el._g)return;el._g=1;el.addEventListener("mousemove",e=>{const r=el.getBoundingClientRect();el.style.setProperty("--x",e.clientX-r.left+"px");el.style.setProperty("--y",e.clientY-r.top+"px")})});
  document.querySelectorAll(".mag,.chat-btn,.lang").forEach(el=>{if(el._m)return;el._m=1;
    el.addEventListener("mousemove",e=>{const r=el.getBoundingClientRect();el.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.3}px,${(e.clientY-r.top-r.height/2)*.4}px)`});
    el.addEventListener("mouseleave",()=>{el.style.transform=""})});
}
/* art parallax + petals */
const art=$("#art");
addEventListener("mousemove",e=>{if(!art||RM)return;const x=(e.clientX/innerWidth-.5),y=(e.clientY/innerHeight-.5);art.style.translate=`${x*-16}px ${y*-12}px`;
  document.querySelectorAll(".hero .bgblob").forEach((b,i)=>b.style.translate=`${x*(i?30:-40)}px ${y*(i?24:-30)}px`)});
function petal(){if(RM||document.hidden||scrollY>innerHeight)return;const r=art.getBoundingClientRect();const p=document.createElement("i");p.className="petal";
  p.style.left=(r.left+r.width*(.66+Math.random()*.26))+"px";p.style.top=(r.top+r.height*(.2+Math.random()*.25)+scrollY)+"px";p.style.position="absolute";
  p.style.setProperty("--dx",(-60-Math.random()*160)+"px");p.style.setProperty("--dy",(160+Math.random()*220)+"px");p.style.animationDuration=(4+Math.random()*3)+"s";
  p.style.width=p.style.height=(7+Math.random()*7)+"px";p.style.background=Math.random()<.3?"#C7B9E8":"#E8C9D2";
  document.body.appendChild(p);setTimeout(()=>p.remove(),7500)}

/* confetti */
function confetti(){if(RM)return;const cv=$("#conf"),x=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#E8C9D2","#C7B9E8","#829BCB","#f4d58d","#FAF9F7"],ps=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:Math.random()*-16-4,s:Math.random()*7+4,c:cols[Math.random()*5|0],r:Math.random()*6,vr:(Math.random()-.5)*.3}));
  let f=0;(function d(){x.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
  if(++f<150)requestAnimationFrame(d);else x.clearRect(0,0,cv.width,cv.height)})()}

/* re-run after language switch / filter */
const _render=render;render=function(){_render();clearTimeout(tTimer);tc=0;tdel=false;typeLoop();
  document.querySelectorAll(".big .mask,.tools,.ev,.proj").forEach(el=>{});observe();
  if(document.querySelector("#stats.in"))document.querySelectorAll(".cnt").forEach(el=>el.textContent=el.dataset.n)};
/* loader */
function start(){
  const hero=document.querySelectorAll(".hero .reveal");hero.forEach((el,i)=>{el.style.transitionDelay=i*0.09+"s";setTimeout(()=>el.classList.add("in"),20)});
  observe();typeLoop();
}
start();

</script>
</body>
</html>
